<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Calenvia</title>
    <meta name="theme-color" content="#4B3FD9" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fbfaf7;
        color: #14161a;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 8px;
      }
      p {
        color: #4a4d55;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 14px;
        background: #4b3fd9;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>Não foi possível abrir a Calenvia. Confira a internet do celular e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
